[project]
name = "kaggriculture-all"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmaes>=0.13.0",
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.7",
    "nbclient>=0.11.0",
    "nevergrad>=1.0.12",
    "openskill>=6.2.0",
    "optuna>=4.9.0",
    "psutil>=5.9.0",
    "pytorch-lightning>=2.6.5",
    "rich>=15.0.0",
    "streamlit>=1.40.0",
    "torch>=2.13.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
timeout = 600
markers = [
    "slow: marks full 720-step simulation tests as slow (run with `pytest -m slow` or `pytest -m \"\"`)"
]
